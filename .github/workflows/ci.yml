# CI：在 Linux 与 Windows 上执行类型检查、构建、全量测试与 CLI 冒烟。
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 只读权限即可，CI 不写入仓库。
permissions:
  contents: read

jobs:
  test:
    # 两个平台都跑，避免路径与子进程差异被漏掉；任一失败不影响另一平台报告。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.23.2']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # 锁定依赖后依次做类型检查、构建、测试。
      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - run: npm test

      # 冒烟 1：示例技能应通过 install 级准入（退出码 0）。
      - name: CLI smoke - example skill passes install gate
        run: node dist/cli/index.js verify examples/invoice-reconcile --gate install

      # 冒烟 2：含宿主预处理命令的恶意样本必须被拒，退出码必须为 2。
      - name: CLI smoke - malicious fixture is rejected with exit code 2
        shell: bash
        run: |
          set +e
          node dist/cli/index.js verify test/fixtures/malicious/preprocessing-command --gate install
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "expected exit code 2, got $code"
            exit 1
          fi

      # 冒烟 3：独立运行时能执行示例技能并在沙箱内产出结果。
      - name: CLI smoke - standalone run of the example skill
        run: node dist/cli/index.js run examples/invoice-reconcile --input examples/invoice-reconcile/data/input.json
